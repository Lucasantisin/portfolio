      <svg class="lead l-mentions" viewBox="0 0 220 260"><use href="#p-pocket"/></svg>
      <svg class="lead l-projet" viewBox="0 0 220 260"><use href="#p-chill"/></svg>
    </div>
    <div class="vig"></div>

  <header class="barre">
    <p class="site"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
    <nav aria-label="Menu principal">
      <ul>
        <li><a href="{{ '/' | relative_url }}" data-s="accueil">Accueil</a></li>
        <li><a href="{{ '/' | relative_url }}#projets" data-s="projets">Projets</a></li>
        <li><a href="{{ '/' | relative_url }}#competences" data-s="competences">Compétences</a></li>
        <li><a href="{{ '/mentions-legales/' | relative_url }}" data-s="mentions">Mentions légales</a></li>
      </ul>
    </nav>
  </header>

  <main>
{{ content }}
  </main>

    <p>{% if site.email != "" %}<a href="mailto:{{ site.email }}">{{ site.email }}</a> · {% endif %}{% if site.linkedin != "" %}<a href="{{ site.linkedin }}">LinkedIn</a> · {% endif %}contenu sous licence <a href="https://creativecommons.org/licenses/by/4.0/deed.fr">CC BY 4.0</a> · <a href="{{ '/mentions-legales/' | relative_url }}">mentions légales</a></p>
  </footer>

  <div class="wipe" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>

  <script>
  (function () {
    var body = document.body, calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
    var tabs = [].slice.call(document.querySelectorAll('nav a[data-s]'));
    var w = document.querySelector('.wipe'), busy = false, curPath = location.pathname;
    var map = { accueil: 'accueil', projets: 'projets', competences: 'competences', projet: 'projets', mentions: 'mentions' };

    /* titre façon lettres découpées */
    var logo = document.querySelector('.site a'), txt = logo.textContent.trim();
    logo.setAttribute('aria-label', txt); logo.textContent = '';
    txt.split('').forEach(function (c) {
      var s = document.createElement('span');
      if (c === ' ') s.className = 'sp'; else { s.className = 'rl'; s.textContent = c; s.setAttribute('aria-hidden', 'true'); }
      logo.appendChild(s);
    });

    /* pose de caméra + onglet actif */
    function setPose(p) {
      if (body.dataset.pose !== p) body.dataset.pose = p;
      tabs.forEach(function (a) { if (a.dataset.s === map[p]) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
    }
    function track() {
      if (!document.getElementById('projets')) return;
      var k = 'accueil';
      ['projets', 'competences'].forEach(function (id) {
        var e = document.getElementById(id);
        if (e && e.getBoundingClientRect().top < innerHeight * .45) k = id;
      });
      setPose(k);
    }
    addEventListener('scroll', track, { passive: true });
    setPose(body.dataset.pose); track();

    /* changement de page : rideaux rouge/noir/blanc pendant que la caméra bouge */
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    async function go(url, push) {
      if (busy) return; busy = true;
      w.className = 'wipe on'; await wait(650);
      try {
        var res = await fetch(url, { credentials: 'same-origin' });
        if (!res.ok) throw 0;
        var doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        var m = doc.querySelector('main'); if (!m) throw 0;
        document.querySelector('main').innerHTML = m.innerHTML;
        document.title = doc.title;
        if (push) { try { history.pushState(null, '', url); } catch (e) {} }
        var u = new URL(url, location.href); curPath = u.pathname;
        scrollTo(0, 0); setPose(doc.body.dataset.pose);
        if (u.hash) { var t = document.getElementById(u.hash.slice(1)); if (t) t.scrollIntoView(); }
      } catch (e) { location.href = url; return; }
      w.className = 'wipe out'; await wait(700); w.className = 'wipe'; busy = false; track();
    }
    document.addEventListener('click', function (e) {
      if (calm || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target.closest('a'); if (!a || a.target || a.hasAttribute('download')) return;
      var u = new URL(a.href, location.href); if (u.origin !== location.origin) return;
      if (u.pathname === location.pathname) { if (!u.hash) { e.preventDefault(); scrollTo({ top: 0, behavior: 'smooth' }); } return; }
      e.preventDefault(); go(u.href, true);
    });
    addEventListener('popstate', function () { if (location.pathname !== curPath) go(location.href, false); });
  })();
  </script>
</body>
