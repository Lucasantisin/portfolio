<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.resume | default: site.description }}">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
  <div class="decor" aria-hidden="true">
    <canvas id="espace"></canvas>
    <div class="neb"><i></i><i></i><i></i></div>
    <div class="ecl" data-f=".03"><div class="sun"></div><div class="mn"></div></div>
    <div class="pl home" data-f=".05"><i></i></div>
    <div class="pl moon" data-f=".08"><i></i></div>
    <div class="limb"></div>
    <div class="au" style="--c:#34d399;left:12vw"></div>
    <div class="au" style="--c:#38bdf8;left:32vw;animation-delay:-2s"></div>
    <div class="au" style="--c:#a78bfa;left:52vw;animation-delay:-4s"></div>
    <div class="au" style="--c:#f472b6;left:70vw;animation-delay:-1s"></div>
  </div>

  <header class="barre">
    <p class="site"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
    <nav aria-label="Menu principal">
      <ul>
        <li><a href="{{ '/' | relative_url }}" data-s="accueil"{% if page.url == '/' %} aria-current="true"{% endif %}>Accueil</a></li>
        <li><a href="{{ '/' | relative_url }}#projets" data-s="projets"{% if page.collection == 'projets' %} aria-current="true"{% endif %}>Projets</a></li>
        <li><a href="{{ '/' | relative_url }}#competences" data-s="competences">Compétences</a></li>
        <li><a href="{{ '/mentions-legales/' | relative_url }}"{% if page.url contains 'mentions-legales' %} aria-current="true"{% endif %}>Mentions légales</a></li>
      </ul>
    </nav>
  </header>

  <main>
{{ content }}
  </main>

  <footer>
    <p>{% if site.email != "" %}<a href="mailto:{{ site.email }}">{{ site.email }}</a> · {% endif %}{% if site.linkedin != "" %}<a href="{{ site.linkedin }}">LinkedIn</a> · {% endif %}contenu sous licence <a href="https://creativecommons.org/licenses/by/4.0/deed.fr">CC BY 4.0</a> · <a href="{{ '/mentions-legales/' | relative_url }}">mentions légales</a></p>
  </footer>

  <script>
  (function () {
    var cv = document.getElementById('espace'), g = cv.getContext('2d'), W, H, sy = 0, cur = 0;
    var calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
    function size() { var D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * D; cv.height = H * D; g.setTransform(D, 0, 0, D, 0, 0); }
    size(); addEventListener('resize', size);
    var T = [[.05, 110, .9], [.12, 70, 1.3], [.22, 35, 1.9]].map(function (a) {
      var s = []; for (var i = 0; i < a[1]; i++) s.push({ x: Math.random(), y: Math.random(), a: .3 + Math.random() * .7, p: Math.random() * 6 });
      return { f: a[0], r: a[2], s: s };
    });
    var layers = [].slice.call(document.querySelectorAll('[data-f]'));
    function draw(t) {
      cur = calm ? sy : cur + (sy - cur) * .08;
      g.clearRect(0, 0, W, H);
      T.forEach(function (L) {
        L.s.forEach(function (s) {
          var y = ((s.y * H - cur * L.f) % H + H) % H;
          g.globalAlpha = s.a * (.65 + .35 * Math.sin(t / 900 + s.p));
          g.fillStyle = s.p > 4.2 ? '#f0abfc' : s.p > 2.4 ? '#bae6fd' : '#fff';
          g.beginPath(); g.arc(s.x * W, y, L.r * (.5 + s.a / 2), 0, 7); g.fill();
        });
      });
      g.globalAlpha = 1;
      layers.forEach(function (l) { l.style.transform = 'translate3d(0,' + (-cur * l.dataset.f) + 'px,0)'; });
      if (!calm) requestAnimationFrame(draw);
    }
    addEventListener('scroll', function () { sy = scrollY; if (calm) draw(0); }, { passive: true });
    requestAnimationFrame(draw);

    /* onglet actif selon la section visible (page d'accueil seulement) */
    if (document.getElementById('projets')) {
      var tabs = [].slice.call(document.querySelectorAll('nav a[data-s]'));
      var upd = function () {
        var k = 'accueil';
        ['projets', 'competences'].forEach(function (id) {
          var e = document.getElementById(id);
          if (e && e.getBoundingClientRect().top < innerHeight * .4) k = id;
        });
        tabs.forEach(function (a) { if (a.dataset.s === k) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
      };
      addEventListener('scroll', upd, { passive: true }); upd();
    }
  })();
  </script>
</body>
</html>
